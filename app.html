<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lens — Classify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper: #FAF8F4;
    --ink: #1C1B1A;
    --sienna: #C75D3D;
    --sienna-deep: #A8472E;
    --slate: #6B7280;
    --border: #E8E2D5;
    --card: #FFFFFF;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 2.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--paper);
  }

  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 26px; height: 26px; position: relative; }
  .brand-mark::before, .brand-mark::after {
    content: ''; position: absolute; border: 2px solid var(--ink);
  }
  .brand-mark::before { width: 10px; height: 10px; top: 0; left: 0; border-right: none; border-bottom: none; }
  .brand-mark::after { width: 10px; height: 10px; bottom: 0; right: 0; border-left: none; border-top: none; }
  .brand span { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; }

  .nav-right { display: flex; align-items: center; gap: 1.25rem; }

  .user-pill {
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; color: var(--slate);
  }
  .user-pill .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--sienna); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; font-family: 'Inter', sans-serif;
  }

  .btn-logout {
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--ink);
    padding: 7px 16px;
    border-radius: 3px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s;
  }
  .btn-logout:hover { border-color: var(--sienna); color: var(--sienna-deep); }

  .layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    max-width: 1200px;
    margin: 0 auto;
    gap: 2.5rem;
    padding: 2.5rem;
  }

  .main-col { min-width: 0; }

  .page-head { margin-bottom: 1.75rem; }
  .page-head .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--sienna-deep);
    margin-bottom: 6px;
  }
  .page-head h1 {
    font-family: 'Fraunces', serif;
    font-size: 28px; font-weight: 500; letter-spacing: -0.01em;
  }

  .upload-zone {
    border: 1.5px dashed var(--border);
    border-radius: 4px;
    background: var(--card);
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--sienna);
    background: #FDF8F4;
  }
  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
  }

  .upload-icon-frame {
    width: 52px; height: 52px;
    margin: 0 auto 1.1rem;
    position: relative;
  }
  .upload-icon-frame .corner {
    position: absolute; width: 16px; height: 16px;
    border: 2px solid var(--sienna);
  }
  .upload-icon-frame .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
  .upload-icon-frame .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
  .upload-icon-frame .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
  .upload-icon-frame .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }
  .upload-icon-frame .center-icon {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 20px;
  }

  .upload-zone h3 {
    font-family: 'Fraunces', serif;
    font-size: 17px; font-weight: 500; margin-bottom: 4px;
  }
  .upload-zone p { font-size: 13px; color: var(--slate); }

  .formats { margin-top: 14px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .tag {
    background: var(--paper); border: 1px solid var(--border);
    border-radius: 3px; padding: 3px 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; color: var(--slate);
  }

  .preview-area { display: none; margin-top: 1.5rem; }
  .preview-area.visible { display: block; }

  .preview-card {
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--card); overflow: hidden;
  }

  .preview-img-wrap {
    position: relative; background: var(--paper);
    display: flex; align-items: center; justify-content: center;
    min-height: 220px; max-height: 360px; overflow: hidden;
  }
  .preview-img-wrap img { max-width: 100%; max-height: 360px; object-fit: contain; display: block; }

  .vf-corner { position: absolute; width: 24px; height: 24px; border: 2px solid var(--sienna); opacity: 0.8; }
  .vf-corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .vf-corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .vf-corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .vf-corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

  .preview-controls {
    padding: 1rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--border); gap: 1rem;
  }

  .img-name {
    font-size: 13px; color: var(--slate);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px;
    font-family: 'JetBrains Mono', monospace;
  }

  .btn-row { display: flex; gap: 8px; }

  .btn {
    padding: 9px 18px; border-radius: 3px; border: 1.5px solid var(--border);
    background: var(--paper); color: var(--ink);
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { border-color: var(--ink); }

  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn.primary:hover { background: var(--sienna-deep); border-color: var(--sienna-deep); }
  .btn.primary:disabled { background: #BFBAAE; border-color: #BFBAAE; cursor: not-allowed; }

  .btn.danger { background: transparent; border-color: var(--border); color: var(--sienna-deep); }
  .btn.danger:hover { border-color: var(--sienna); }

  .results-area { display: none; margin-top: 1.5rem; }
  .results-area.visible { display: block; }

  .result-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }

  .result-header {
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .result-header .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sienna); flex-shrink: 0; }
  .result-header h4 { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; flex: 1; }
  .model-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--slate);
    background: var(--paper); padding: 3px 9px; border-radius: 3px; border: 1px solid var(--border);
  }

  .primary-result { padding: 1.75rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1.1rem; }
  .object-icon {
    width: 58px; height: 58px; border-radius: 4px;
    background: #FDF1EE; border: 1px solid #E8B4A4;
    display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0;
  }
  .object-info h3 { font-family: 'Fraunces', serif; font-size: 23px; font-weight: 600; text-transform: capitalize; }
  .object-info p { font-size: 13px; color: var(--slate); margin-top: 2px; }
  .confidence-pill {
    margin-left: auto; font-family: 'JetBrains Mono', monospace;
    font-size: 14px; font-weight: 600; color: var(--sienna-deep);
    background: #FDF1EE; border: 1px solid #E8B4A4; padding: 6px 14px; border-radius: 20px;
  }

  .top-predictions { padding: 1.1rem 1.25rem; }
  .top-predictions h5 {
    font-size: 11.5px; font-weight: 600; color: var(--slate);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 12px;
  }
  .pred-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .pred-label { font-size: 13px; color: var(--ink); width: 140px; flex-shrink: 0; text-transform: capitalize; }
  .pred-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .pred-bar { height: 100%; background: var(--sienna); border-radius: 4px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
  .pred-pct { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--slate); width: 38px; text-align: right; flex-shrink: 0; }

  .description-section { border-top: 1px solid var(--border); padding: 1.25rem; }
  .description-section h5 {
    font-size: 11.5px; font-weight: 600; color: var(--slate);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px;
  }
  .description-section p { font-size: 14px; color: #3A3836; line-height: 1.7; }

  .loading-overlay { display: none; padding: 2.75rem 1.25rem; text-align: center; }
  .loading-overlay.visible { display: block; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--sienna); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-overlay p { font-size: 14px; color: var(--slate); }
  .loading-overlay .step { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #B5AFA0; margin-top: 4px; }

  .error-box {
    display: none; background: #FDF1EE; border: 1px solid #E8B4A4; border-radius: 4px;
    padding: 1rem 1.25rem; margin-top: 1rem; font-size: 14px; color: var(--sienna-deep);
  }
  .error-box.visible { display: block; }

  .sidebar {
    border-left: 1px solid var(--border);
    padding-left: 2.5rem;
  }

  .sidebar h2 {
    font-family: 'Fraunces', serif;
    font-size: 16px; font-weight: 500; margin-bottom: 1rem;
  }

  .history-empty {
    font-size: 13px; color: var(--slate); line-height: 1.6;
    padding: 1rem 0;
  }

  .history-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
    cursor: default;
  }
  .history-item .h-icon {
    width: 34px; height: 34px; border-radius: 3px;
    background: #FDF1EE; display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .history-item .h-text { flex: 1; min-width: 0; }
  .history-item .h-label { font-size: 13px; font-weight: 600; text-transform: capitalize; }
  .history-item .h-time { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--slate); margin-top: 2px; }
  .history-item .h-conf { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--sienna-deep); flex-shrink: 0; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; padding: 1.5rem; }
    .sidebar { border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 2rem; }
    nav { padding: 1rem 1.5rem; }
    .user-pill span.label { display: none; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="brand" style="text-decoration:none; color:var(--ink);">
    <div class="brand-mark"></div>
    <span>Lens</span>
  </a>
  <div class="nav-right">
    <div class="user-pill">
      <div class="avatar" id="userAvatar">?</div>
      <span class="label" id="userName">Loading...</span>
    </div>
    <button class="btn-logout" id="logoutBtn">Sign out</button>
  </div>
</nav>

<div class="layout">
  <div class="main-col">
    <div class="page-head">
      <div class="eyebrow">CLASSIFIER</div>
      <h1>What are you looking at?</h1>
    </div>

    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*">
      <div class="upload-icon-frame">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="center-icon">📷</div>
      </div>
      <h3>Drop an image here or click to browse</h3>
      <p>Supports bottles, cups, phones, bags, books, chairs, keys, and more</p>
      <div class="formats">
        <span class="tag">JPG</span><span class="tag">PNG</span><span class="tag">WEBP</span><span class="tag">GIF</span>
      </div>
    </div>

    <div class="preview-area" id="previewArea">
      <div class="preview-card">
        <div class="preview-img-wrap">
          <div class="vf-corner tl"></div><div class="vf-corner tr"></div>
          <div class="vf-corner bl"></div><div class="vf-corner br"></div>
          <img id="previewImg" src="" alt="Preview">
        </div>
